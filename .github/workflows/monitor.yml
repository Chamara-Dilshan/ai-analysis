name: BTC-ETH hourly monitor

on:
  # The hourly schedule is DELIBERATELY DISABLED. Binance refuses US IP
  # addresses with HTTP 451, and GitHub-hosted runners are US-based with no
  # way to choose a region — so every scheduled run fetched nothing. Worse, it
  # exited 0 and showed a green check each time, because check_symbol catches
  # per-symbol fetch errors; 19 consecutive runs looked healthy while logging
  # only errors.
  #
  # The live monitor now runs hourly from an Oracle Cloud VM in Mumbai, where
  # Binance responds normally. See sync-to-vm.ps1.
  #
  # Only re-enable this if BINANCE_BASE_URL is pointed at a mirror or proxy
  # that a US host can actually reach:
  #   schedule:
  #     - cron: "7 * * * *"
  workflow_dispatch:

# Never let two runs overlap and fight over the state cache.
concurrency:
  group: btc-eth-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # State must survive between runs, or every still-standing condition
      # re-alerts every hour. Unique key per run + prefix restore-keys is the
      # standard read-latest/write-new cache pattern.
      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: monitor_state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: |
            monitor-state-

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONITOR_ECHO_STDOUT: "1"
        run: python standalone_monitor.py

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: monitor_state.json
          key: monitor-state-${{ github.run_id }}

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log-${{ github.run_id }}
          path: |
            monitor_log.txt
            latest_alert.txt
          if-no-files-found: ignore
          retention-days: 14
